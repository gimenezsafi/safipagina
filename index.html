<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c7adb0">
<title>safi — presskit</title>
<meta name="description" content="safi — DJ open format, residente en 4rtica y crystalr4ve. Bookings: hola@safi.ar">
<style>
  /* --u es la unidad de toda la página: 1/100 del ancho de la maqueta.
     Se calcula con el ancho Y el alto de la ventana, así todo entra sin scroll */
  :root {
    --u: min(1vw, 100vh / 60);
    /* paleta: solo 3 colores + el claro de la barra (se elige una al azar al entrar) */
    --oscuro: #1E130F;
    --claro: #7A6F72;
    --fondo: #C7ADB0;
    --barra: #E3D6D7;
  }
  @supports (height: 100dvh) { :root { --u: min(1vw, 100dvh / 60); } }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    display: flex;
    align-items: center;
    background: var(--fondo);
    color: var(--oscuro);
    font-family: "Microsoft Sans Serif", Arial, Helvetica, sans-serif;
    font-size: calc(1.875 * var(--u));
    line-height: 1.25;
  }

  a { color: inherit; }

  .pagina {
    width: calc(100 * var(--u));
    margin: 0 auto;
    padding: calc(4 * var(--u)) calc(6 * var(--u));
  }

  /* ---------- cabecera: logo + franja que sale de la "i" ---------- */
  .cabecera {
    --alto: calc(10 * var(--u));
    position: relative;
    display: flex;
    align-items: flex-end;
    height: var(--alto);
    margin-bottom: calc(2.6 * var(--u));
  }
  .logo {
    position: relative;
    z-index: 1;                      /* la "i" queda encima de la franja */
    flex: none;
    height: 100%;
    width: auto;
    overflow: visible;
    display: block;
    fill: var(--oscuro);
  }
  .lado {
    flex: 1;
    height: 100%;
    margin-left: calc(-0.572 * var(--alto));  /* arranca en el borde de la "i" */
    display: grid;
    grid-template-rows: 29.5% 70.5%;          /* punto de la "i" / cuerpo de la "i" */
    min-width: 0;
  }
  .nav, .franja { padding-left: calc(1.115 * var(--alto)); }
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: calc(0.7 * var(--u));
    color: var(--claro);
  }
  .nav a { text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .nav a[aria-current] { color: var(--oscuro); }
  .franja {
    grid-row: 2;
    background: var(--barra);
    display: flex;
    align-items: center;
    padding-right: calc(2 * var(--u));
    white-space: nowrap;
  }

  /* ---------- cuerpo ---------- */
  .cuerpo {
    display: grid;
    grid-template-columns: 539fr 310fr;
    column-gap: calc(3.1 * var(--u));
  }
  .tabs {
    grid-column: 1;
    display: flex;
    gap: calc(3.1 * var(--u));
    margin-bottom: calc(0.9 * var(--u));
  }
  .tabs button {
    display: flex;
    align-items: center;
    gap: .3em;
    font: inherit;
    text-transform: uppercase;
    white-space: nowrap;
    background: none;
    border: 0;
    color: var(--claro);
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--oscuro); }
  .tabs .num {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.22em;
    height: 1.22em;
    border: .12em solid currentColor;
    border-radius: 50%;
  }
  .tabs .num b { font: bold .78em Consolas, "Courier New", monospace; }
  .tabs button:hover .num,
  .tabs button[aria-selected="true"] .num { background: var(--barra); }

  .video {
    grid-column: 1;
    background: #000;
    aspect-ratio: 16 / 9;
  }
  .video iframe { display: block; width: 100%; height: 100%; border: 0; }

  .tags {
    grid-column: 1;
    margin-top: calc(0.5 * var(--u));
  }

  /* foto espejada y oscurecida, con las fechas encima */
  .ficha {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    overflow: hidden;
    color: #ffffff;
    display: flex;
    align-items: center;
  }
  /* recuadro negro al 50% por encima de la foto (que también va al 50%) */
  .ficha::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000000;
    opacity: .5;
  }
  .ficha img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 97% center;
    transform: scaleX(-1);
    opacity: .5;
  }
  .fechas {
    position: relative;
    z-index: 2;
    padding: 0 calc(1.4 * var(--u));
    line-height: 1.55;
    white-space: nowrap;
  }
  .fechas ul { list-style: none; margin-bottom: 1.55em; }
  .fechas .pasada { text-decoration: line-through; }

  /* ---------- versión celular ---------- */
  @media (max-aspect-ratio: 1/1) {
    :root { --u: min(1vw, 100vh / 150); }
    @supports (height: 100dvh) { :root { --u: min(1vw, 100dvh / 150); } }

    body { font-size: calc(3.5 * var(--u)); }
    .pagina { padding: calc(6 * var(--u)) calc(4 * var(--u)); }

    /* el menú baja a una fila propia debajo del logo */
    .cabecera { --alto: calc(16 * var(--u)); margin-bottom: calc(16 * var(--u)); }
    .lado { margin-right: calc(-4 * var(--u)); }   /* la franja llega al borde */
    .nav {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4.5 * var(--u));
      padding: 0;
    }
    .franja {
      padding-left: calc(0.72 * var(--alto));
      padding-right: calc(4 * var(--u));
      font-size: calc(3 * var(--u));
      white-space: normal;
    }

    .cuerpo { display: block; }
    .tabs { justify-content: space-between; gap: 0; margin-bottom: calc(1.5 * var(--u)); font-size: calc(3.3 * var(--u)); }
    .tags { margin-top: calc(1.5 * var(--u)); min-height: 2.5em; }

    .ficha { margin-top: calc(4 * var(--u)); }
    .ficha img { object-position: center 15%; }
    /* fechas de a dos por renglón, en un recuadro bajo que ocupa todo el ancho */
    .fechas {
      width: 100%;
      height: 100%;
      padding: calc(3.5 * var(--u)) calc(4 * var(--u));
      display: flex;
      flex-direction: column;
      gap: calc(1.5 * var(--u));
    }
    .fechas ul {
      margin: 0;
      display: grid;
      grid-template-columns: auto auto;
      justify-content: space-between;
      row-gap: calc(1.5 * var(--u));
    }
    .fechas li:nth-child(even) { text-align: right; }
  }
</style>
<script>
  /* paletas: misma familia que el rosa, una distinta cada vez que entrás */
  var paletas = [
    { oscuro: '#1E130F', claro: '#7A6F72', fondo: '#C7ADB0', barra: '#E3D6D7' },  // rosa
    { oscuro: '#171F0F', claro: '#727C6E', fondo: '#B3C8AC', barra: '#D8E2D4' },  // salvia
    { oscuro: '#0F161F', claro: '#6E767C', fondo: '#ACBCC8', barra: '#D4DCE2' },  // celeste
    { oscuro: '#160F1F', claro: '#746E7C', fondo: '#B8ACC8', barra: '#DAD4E2' },  // lila
    { oscuro: '#1F170F', claro: '#7C776E', fondo: '#C8BEAC', barra: '#E2DDD4' },  // arena
  ];
  (function () {
    var anterior = -1, n;
    try { anterior = Number(localStorage.getItem('paleta')); } catch (e) {}
    do { n = Math.floor(Math.random() * paletas.length); } while (n === anterior);
    try { localStorage.setItem('paleta', n); } catch (e) {}
    var p = paletas[n], raiz = document.documentElement.style;
    for (var color in p) raiz.setProperty('--' + color, p[color]);
    document.querySelector('meta[name="theme-color"]').content = p.fondo;
  })();
</script>

<script>
  var tabs = document.querySelectorAll('.tabs button');
  var video = document.getElementById('video');
  var tags = document.getElementById('tags');

  function elegir(tab) {
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute('aria-selected', tabs[i] === tab ? 'true' : 'false');
    }
    video.src = 'https://www.youtube.com/embed/' + tab.getAttribute('data-video');
    tags.textContent = tab.getAttribute('data-tags');
  }

  for (var i = 0; i < tabs.length; i++) {
    tabs[i].onclick = function () { elegir(this); };
  }
  elegir(tabs[0]);
</script>
