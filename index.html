<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>safi — presskit</title>
<meta name="description" content="safi — DJ residente en artica y crystal rave. Bookings: hola@safi.ar">
<style>
  /* --u es la unidad de toda la página: 1/100 del ancho de la maqueta */
  /* se calcula con el ancho Y el alto de la ventana, así todo entra sin scroll */
  :root { --u: min(1vw, 100vh / 60); --gris: #808080; }
  @supports (height: 100dvh) { :root { --u: min(1vw, 100dvh / 60); } }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    display: flex;
    align-items: center;
    background: #fff;
    color: #000;
    font-family: "Microsoft Sans Serif", Arial, Helvetica, sans-serif;
    font-size: max(1.25 * var(--u), 9px);
    line-height: 1.25;
  }

  a { color: inherit; }

  .pagina {
    width: calc(100 * var(--u));
    margin: 0 auto;
    padding: calc(4 * var(--u)) calc(6 * var(--u));
  }

  /* ---------- cabecera: logo + franja que sale de la "i" ---------- */
  .cabecera {
    --alto: calc(9.5 * var(--u));
    display: flex;
    align-items: flex-end;
    height: var(--alto);
    margin-bottom: calc(3 * var(--u));
  }
  .logo {
    flex: none;
    height: 100%;
    width: auto;
    overflow: visible;
    display: block;
  }
  .lado {
    flex: 1;
    height: 100%;
    margin-left: -1px;              /* se pega al palo de la "i" */
    display: grid;
    grid-template-rows: 25.9% 74.1%; /* punto de la "i" / palo de la "i" */
    min-width: 0;
  }
  .nav {
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    gap: calc(4 * var(--u));
    padding-bottom: calc(0.5 * var(--u));
    color: var(--gris);
  }
  .nav a:hover { color: #000; }
  .franja {
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    text-align: right;
    padding: 0 calc(2 * var(--u));
    white-space: nowrap;
  }
  .franja .booking { font-size: calc(1.9 * var(--u)); }

  /* ---------- cuerpo ---------- */
  .cuerpo {
    display: grid;
    grid-template-columns: 61fr 35fr;
    column-gap: calc(3.5 * var(--u));
  }
  .tabs {
    grid-column: 1;
    display: flex;
    gap: calc(6 * var(--u));
    margin-bottom: calc(0.9 * var(--u));
  }
  .tabs button {
    font: inherit;
    font-size: calc(1.9 * var(--u));
    text-transform: uppercase;
    background: none;
    border: 0;
    color: var(--gris);
    cursor: pointer;
  }
  .tabs button:hover { text-decoration: underline; }
  .tabs button[aria-selected="true"] { color: #000; }

  .video {
    grid-column: 1;
    background: #000;
    aspect-ratio: 16 / 9;
  }
  .video iframe { display: block; width: 100%; height: 100%; border: 0; }

  .tags {
    grid-column: 1;
    margin-top: calc(0.7 * var(--u));
  }

  .ficha {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .ficha img {
    display: block;
    width: 100%;
    flex: 1;
    min-height: 0;
    object-fit: cover;
    object-position: 80% center;
  }
  .fechas {
    background: #000;
    color: #fff;
    display: flex;
    justify-content: space-between;
    gap: calc(1.5 * var(--u));
    padding: calc(1.8 * var(--u)) calc(1.4 * var(--u));
    font-size: max(1.05 * var(--u), 8px);
    text-align: right;
    white-space: nowrap;
  }
  .fechas ul { list-style: none; }
  .fechas .pasadas { text-decoration: line-through; }
  .fechas .proximas li + li { margin-top: 1.25em; }
  .fechas a { display: block; }

  /* ---------- versión celular ---------- */
  @media (max-aspect-ratio: 1/1) {
    :root { --u: min(1vw, 100vh / 162); }
    @supports (height: 100dvh) { :root { --u: min(1vw, 100dvh / 162); } }
    body { font-size: calc(3.6 * var(--u)); }
    .pagina { padding: calc(6 * var(--u)) calc(4 * var(--u)); }

    .cabecera { --alto: calc(16 * var(--u)); margin-bottom: calc(9 * var(--u)); }
    .lado { margin-right: calc(-4 * var(--u)); }   /* la franja llega al borde */
    .nav {
      justify-content: space-between;
      gap: 0;
      padding: 0 calc(4 * var(--u)) calc(0.6 * var(--u)) calc(5 * var(--u));
      font-size: calc(3.1 * var(--u));
      color: #000;
    }
    .franja { padding: 0 calc(4 * var(--u)) 0 0; font-size: calc(2.7 * var(--u)); }
    .franja .booking { font-size: calc(4 * var(--u)); }

    .cuerpo { display: block; }
    .tabs { justify-content: space-between; gap: 0; margin-bottom: calc(1.5 * var(--u)); }
    .tabs button { font-size: calc(4 * var(--u)); }
    .tags { margin-top: calc(1.5 * var(--u)); }

    .ficha { flex-direction: row; margin-top: calc(9 * var(--u)); }
    .ficha img { flex: none; width: 58%; aspect-ratio: 3 / 2; }
    .fechas {
      flex: 1;
      flex-direction: column;
      justify-content: center;
      gap: 1.25em;
      padding: calc(3 * var(--u));
      font-size: calc(2.7 * var(--u));
    }
  }
</style>
</head>

    <div class="lado">
      <nav class="nav">
        <!-- reemplazar por los links personales -->
        <a href="https://instagram.com" target="_blank" rel="noopener">instagram</a>
        <a href="https://soundcloud.com" target="_blank" rel="noopener">soundcloud</a>
        <a href="#" target="_blank" rel="noopener">rider</a>

      <div class="franja">
        <p>DJ residente en artica y crystal rave</p>
        <p class="booking"><a href="mailto:hola@safi.ar">bookings: hola@safi.ar</a></p>
      </div>
    </div>
  </header>

  <main class="cuerpo">
    <!-- para cambiar un set: data-video = ID del video de YouTube, data-tags = etiquetas -->
    <div class="tabs" role="tablist" aria-label="sets">
      <button role="tab" aria-selected="true"
              data-video="sQHq2Ykv404"
              data-tags="pop, reguetón, electropop, pop nacional, pop internacional">pop</button>
      <button role="tab" aria-selected="false"
              data-video="v2Yix5gc89k"
              data-tags="electropop, hyperpop, dance pop, house, remixes">electrónica pop</button>
      <button role="tab" aria-selected="false"
              data-video="p5u6rpDPImM"
              data-tags="techno, hard techno, house, trance, hardgroove">electrónica</button>
    </div>

    <div class="video">
      <iframe id="video" title="set" allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>

    <p class="tags" id="tags"></p>

        </ul>
        <ul class="proximas">

            <a href="https://www.tikzet.com/events/4rtica" target="_blank" rel="noopener">tickets</a></li>
          <li>02/01: TBA</li>
        </ul>
      </div>
    </aside>
  </main>

</div>

<script>
  var tabs = document.querySelectorAll('.tabs button');
  var video = document.getElementById('video');
  var tags = document.getElementById('tags');

  function elegir(tab) {
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute('aria-selected', tabs[i] === tab ? 'true' : 'false');
    }
    video.src = 'https://www.youtube.com/embed/' + tab.getAttribute('data-video');
    tags.textContent = tab.getAttribute('data-tags');
  }

  for (var i = 0; i < tabs.length; i++) {
    tabs[i].onclick = function () { elegir(this); };
  }
  elegir(tabs[0]);
</script>
